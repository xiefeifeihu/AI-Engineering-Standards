# Adapt placeholders to your project. This template is not production-ready configuration.
name: Generic candidate artifact handoff
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project build and immutable artifact publication
        run: python scripts/release/cloud_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-manifest
          path: .artifacts/evidence/release_manifest.json
  approval:
    needs: verify-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Candidate UNAPPROVED; executor must independently verify configured approval policy"
# Controlled executor reads authenticated reviews, policy and exact build artifact,
# consumes the release ID transactionally, then dispatches the project's WSL,
# Linux Docker, remote SSH/agent or native process adapter. Hosted jobs never
# access the local Docker daemon. Missing adapter/configuration MUST BLOCK.

# This template illustrates the GITHUB_ENVIRONMENT_REVIEW job topology only.
# Required reviewers and prevent-self-review must actually be configured and
# verified through authenticated API. For an explicitly governed local-key
# profile, publish only a candidate; obtain independent human signing outside CI.
# Never generate a signing key or reusable approval token on the runner.
