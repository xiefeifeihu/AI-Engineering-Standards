name: Standards Schema Validation & Governance CI (STD-034)

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "main"
      - "codex/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  validate-standards:
    name: Validate JSON Schemas & Engineering Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Standards Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate JSON Schemas
        run: |
          python tools/validate-schemas.py

      - name: Verify VERSION Consistency
        run: |
          test -f VERSION
          echo "Verified Standards VERSION: $(cat VERSION)"
