name: Standards Schema Validation & Governance CI (STD-034)

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "main"
      - "codex/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  validate-standards:
    name: Validate Schemas, Docs, Baseline, Handoff, Sync & Approval Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Standards Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-standards.txt

      - name: Validate JSON Schemas & Samples
        run: |
          python tools/validate-schemas.py

      - name: Validate Documentation Collection, Links, Anchors & 12 Templates (STD-035)
        run: |
          python tools/validate-documentation-collection.py --project-root . --schema schemas/documentation-metadata.schema.json --check-templates

      - name: Verify Deterministic Engineering Baseline (STD-035)
        run: |
          python tools/generate_engineering_baseline.py --project-root . --verify-only

      - name: Verify Automated Cross-Session Handoff Contract (STD-020)
        run: |
          python tools/generate_handoff.py --project-root . --task-id STANDARDS-BASELINE-SYNC-GOVERNANCE-IMPLEMENTATION-001 --verify-only

      - name: Verify Official Standards Sync Tool & Lock Contract (STD-034)
        run: |
          python tools/standards_sync/cli.py verify-lock --project-root .
          python tools/standards_sync/cli.py compare --from-ref v2.11.0 --to-ref WORKTREE

      - name: Run Consumer Integration Contract Tests
        run: |
          python -m unittest tests.test_consumer_integration_contract -v

      - name: Run Full Unit, Approval Authenticity & Compatibility Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify VERSION Consistency
        shell: bash
        run: |
          test -f VERSION
          echo "Verified Standards VERSION: $(cat VERSION)"

  publish-version-tag:
    name: Publish Standards Tag after main CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-standards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and publish immutable annotated Standards Tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be SemVer MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="v$version"
          current_sha="$(git rev-parse HEAD)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::HEAD does not match workflow target SHA"
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$current_sha" ]]; then
            echo "::error::main has moved; stale workflow cannot tag older commit"
            exit 1
          fi
          existing="$(git ls-remote origin "refs/tags/$tag")"
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            peeled="$(git rev-parse "$tag^{commit}")"
            if [[ "$peeled" == "$current_sha" ]]; then
              echo "Tag already verified: $tag -> $peeled"
            elif git merge-base --is-ancestor "$peeled" "$current_sha"; then
              echo "Existing immutable release Tag $tag -> $peeled is an ancestor of current main $current_sha."
              echo "No new Tag is created because this VERSION has already been released."
              echo "STANDARDS_TAG=$tag" >> "$GITHUB_STEP_SUMMARY"
              echo "STANDARDS_PEELED_COMMIT=$peeled" >> "$GITHUB_STEP_SUMMARY"
              echo "TAG_ACTION=SKIPPED_EXISTING_RELEASE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              echo "::error::Existing immutable Tag is not on current main ancestry; refusing to overwrite or reuse it"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$current_sha" -m "Standards $tag - validated main CI"
            git push origin "refs/tags/$tag"
          fi
          remote_peeled="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [[ "$remote_peeled" != "$current_sha" ]]; then
            echo "::error::Remote peeled Tag does not match this main commit"
            exit 1
          fi
          echo "STANDARDS_TAG=$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "STANDARDS_PEELED_COMMIT=$remote_peeled" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLISHED_NON_RUNTIME_ARTIFACT=true" >> "$GITHUB_STEP_SUMMARY"
